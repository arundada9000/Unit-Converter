    <script>
        const inputType = document.getElementById("input-type");
        const outputType = document.getElementById("output-type");
        const inputValue = document.getElementById("input-value");
        const outputValue = document.getElementById("output-value");
        inputType.selectedIndex = 3;
        outputType.selectedIndex = 2;

        inputType.addEventListener("change", () => {
            if (inputValue.value !== "") {
                change(inputValue.value, 0, inputType.value, outputType.value);
            }
        });
        outputType.addEventListener("change", () => {
            if (inputValue.value !== "") {
                change(0, outputValue.value, outputType.value, inputType.value);
            }
        });
        inputValue.addEventListener("keyup", () => {
            if (inputValue.value !== "")
                change(inputValue.value, 0, inputType.value, outputType.value);
            else
                outputValue.value = "";
        });
        outputValue.addEventListener("keyup", () => {
            if (outputValue.value !== "")
                change(0, outputValue.value, outputType.value, inputType.value);
            else
                inputValue.value = "";
        });

        function change(num, result, inputType, outputType) {
            let input = true;
            if (result != 0) {
                num = result;
                input = false;
            }

            switch (inputType) {
                case "bit":
                    num = num / (8 * 1024 * 1024);
                    break;
                case "b":
                    num = num / 1048576;
                    break;
                case "kb":
                    num = num / 1024;
                    break;
                case "mb":
                    num = num;
                    break;
                case "gb":
                    num = num * 1024;
                    break;
                case "tb":
                    num = num * 1048576;
                    break;
                case "pb":
                    num = num * (1024 * 1024 * 1024);
                    break;
                default:
                    num = NaN;
            }

            switch (outputType) {
                case "bit":
                    num = num * (8 * 1024 * 1024);
                    break;
                case "b":
                    num = num * 1048576;
                    break;
                case "kb":
                    num = num * 1024;
                    break;
                case "mb":
                    num = num;
                    break;
                case "gb":
                    num = num / 1024;
                    break;
                case "tb":
                    num = num / 1048576;
                    break;
                case "pb":
                    num = num / (1024 * 1024 * 1024);
                    break;
                default:
                    num = NaN;
            }

            if (input) {
                outputValue.value = num;
            }
            else {
                inputValue.value = num;
            }
        }
    </script>
