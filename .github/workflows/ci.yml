name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site-check:
    name: Site check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML pages
        run: |
          python .github/scripts/check_site.py

  ascii-check:
    name: ASCII-only source files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for non-ASCII characters in source files
        run: |
          python .github/scripts/check_ascii.py
